name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pre-commit validation (JS syntax / CDN pins / state-machine parity)
        run: node scripts/validate.mjs

  build-desktop:
    needs: [validate]
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            target: deb
            artifacts: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            target: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli --version "^2"

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Prepare web assets
        run: sh prepare-web.sh
        shell: bash

      - name: Build ${{ matrix.target }}
        run: cargo tauri build --bundles ${{ matrix.target }}

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}

  build-android:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Prepare web assets
        run: sh prepare-web.sh
        shell: bash

      - name: Build Android APK
        run: cargo tauri android build --target aarch64

      - uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          generate_release_notes: true
