name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: dmg
            artifact_pattern: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            target: deb
            artifact_pattern: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            target: nsis
            artifact_pattern: src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Prepare web assets
        run: sh prepare-web.sh
        shell: bash

      - name: Build ${{ matrix.target }}
        run: cargo tauri build --bundles ${{ matrix.target }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_pattern }}
          generate_release_notes: true
