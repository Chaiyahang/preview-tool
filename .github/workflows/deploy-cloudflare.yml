name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run pre-commit validation (JS syntax / CDN pins / state-machine parity)
        run: node scripts/validate.mjs

  deploy:
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cloudflare/wrangler-action@v4
        with:
          accountId: b156801868d2ea02453c03296028b59f
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy . --project-name=preview-tool --branch=main
